<app-auth-layout
  heroTitulo="Todo passeio rende uma boa história."
  heroTexto="Marque encontros com outros bichos da vizinhança, registre as rotas favoritas e acompanhe quantos quilômetros de rabo abanando vocês já somaram."
  titulo="Bem-vindo de volta!"
  subtitulo="Entre para ver os encontros do rolê e registrar o próximo passeio."
>
  @if (erroGeral(); as erro) {
    <p class="alert" role="alert">{{ erro }}</p>
  }

  <form class="auth__form" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <div class="field">
      <label class="field__label" for="email">E-mail</label>
      <input
        id="email"
        type="email"
        class="field__input"
        formControlName="email"
        placeholder="tutor@exemplo.com"
        autocomplete="email"
        inputmode="email"
        [class.field__input--invalid]="emailErro()"
        [attr.aria-invalid]="emailErro() ? 'true' : null"
        [attr.aria-describedby]="emailErro() ? 'email-erro' : null"
      />
      @if (emailErro(); as erro) {
        <p class="field__error" id="email-erro" role="alert">{{ erro }}</p>
      }
    </div>

    <div class="field">
      <label class="field__label" for="senha">Senha</label>
      <div class="field__wrap">
        <input
          id="senha"
          class="field__input"
          formControlName="senha"
          [type]="senhaVisivel() ? 'text' : 'password'"
          placeholder="Sua senha secreta"
          autocomplete="current-password"
          [class.field__input--invalid]="senhaErro()"
          [attr.aria-invalid]="senhaErro() ? 'true' : null"
          [attr.aria-describedby]="senhaErro() ? 'senha-erro' : null"
        />
        <button
          type="button"
          class="field__toggle"
          (click)="alternarSenha()"
          [attr.aria-pressed]="senhaVisivel()"
        >
          {{ senhaVisivel() ? 'Ocultar' : 'Mostrar' }}
          <span class="sr-only">senha</span>
        </button>
      </div>
      @if (senhaErro(); as erro) {
        <p class="field__error" id="senha-erro" role="alert">{{ erro }}</p>
      }
    </div>

    <div class="auth__row">
      <label class="check">
        <input type="checkbox" formControlName="lembrarMe" />
        <span>Manter conectado</span>
      </label>
      <a routerLink="/recuperar-senha">Esqueci minha senha</a>
    </div>

    <button type="submit" class="btn btn--primary" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <div class="divider"><span>ou continue com</span></div>

  <div class="socials">
    @for (provider of providers; track provider.id) {
      <button type="button" class="btn btn--ghost" (click)="entrarCom(provider.id)">
        {{ provider.label }}
      </button>
    }
  </div>

  <p class="auth__rodape">
    Primeira vez por aqui? <a routerLink="/cadastro">Crie sua conta</a>
  </p>
</app-auth-layout>
