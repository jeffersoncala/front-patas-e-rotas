<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/" aria-label="Patas & Rotas, início">
      <span class="brand__mark"><svg appPata></svg></span>
      <span class="brand__name">Patas <span>&</span> Rotas</span>
    </a>

    <nav class="nav" aria-label="Principal">
      <ng-container
        [ngTemplateOutlet]="linksNav"
        [ngTemplateOutletContext]="{ $implicit: links }"
      />
    </nav>

    <a
      class="avatar"
      routerLink="/perfil"
      [attr.aria-label]="'Perfil de ' + (perfil()?.tutor ?? 'você')"
    >
      <app-avatar [foto]="perfil()?.foto" [nome]="perfil()?.tutor" />
    </a>
  </div>
</header>

<main id="conteudo" tabindex="-1">
  <router-outlet />
</main>

<!-- No celular a navegação fica numa barra fixa no rodapé, fora do header. -->
<nav class="tabbar" aria-label="Principal">
  <ng-container
    [ngTemplateOutlet]="linksNav"
    [ngTemplateOutletContext]="{ $implicit: linksRodape }"
  />
</nav>

<ng-template #linksNav let-links>
  @for (link of links; track link.rota) {
    <a
      class="nav__link"
      [class.nav__link--cta]="link.rota === '/passeios/novo'"
      [routerLink]="link.rota"
      routerLinkActive="nav__link--ativo"
      [routerLinkActiveOptions]="{ exact: link.exato }"
      ariaCurrentWhenActive="page"
    >
      @if (link.curto) {
        <span class="nav__longo">{{ link.label }}</span>
        <span class="nav__curto">{{ link.curto }}</span>
      } @else {
        {{ link.label }}
      }
    </a>
  }
</ng-template>
